<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Online Game Board</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="landing" hidden>
      <div class="landing-card">
        <h1>Online Game Board</h1>
        <p>Онлайн-доска для настольных игр: загрузите карту, добавьте игроков и играйте вместе.</p>
        <button id="create-room-btn" class="btn btn-primary">Создать комнату</button>
        <p id="create-room-disabled-hint" class="hint-text" hidden>
          Создание новых комнат временно отключено.
        </p>
      </div>
    </section>

    <section id="board-view" hidden>
      <div class="board-body">
        <div id="viewport" class="viewport">
          <div id="stage" class="stage">
            <img id="map-image" alt="" draggable="false" />
          </div>
          <div id="tokens-layer"></div>
        </div>

        <div id="settings-panel" class="settings-panel">
          <div class="player-panel-header">
            <span id="role-badge" class="badge"></span>
            <button id="toggle-settings-panel" class="icon-btn" type="button" title="Свернуть/развернуть" hidden>−</button>
          </div>

          <div id="owner-controls" class="owner-controls settings-panel-body" hidden>
            <label class="btn btn-secondary">
              Загрузить карту
              <input id="map-file-input" type="file" accept="image/*" hidden />
            </label>
            <input id="map-url-input" type="url" placeholder="или вставьте URL картинки" />
            <button id="map-url-btn" class="btn btn-secondary">Установить по URL</button>
            <label class="toggle-label">
              <input id="allow-player-edit-toggle" type="checkbox" />
              Разрешить игрокам редактирование
            </label>
          </div>
        </div>

        <aside id="player-panel" class="player-panel" hidden>
          <div class="player-panel-header">
            <h2>Игроки</h2>
            <button id="toggle-player-panel" class="icon-btn" type="button" title="Свернуть/развернуть">−</button>
          </div>

          <div id="player-panel-body" class="player-panel-body">
            <button id="copy-all-links-btn" class="btn btn-secondary" type="button">
              Скопировать все ссылки
            </button>
            <div id="player-list" class="player-list"></div>

            <hr class="panel-divider" />

            <form id="add-player-form" class="player-form">
              <input id="new-player-name" type="text" placeholder="Имя игрока" required />
              <label class="btn btn-secondary">
                Аватар (файл)
                <input id="new-player-avatar-file" type="file" accept="image/*" hidden />
              </label>
              <input id="new-player-avatar-url" type="url" placeholder="или URL аватара" />
              <button type="submit" class="btn btn-primary">Добавить игрока</button>
            </form>
          </div>
        </aside>

        <aside id="self-panel" class="player-panel" hidden>
          <div class="player-panel-header">
            <h2>Мои настройки</h2>
            <button id="toggle-self-panel" class="icon-btn" type="button" title="Свернуть/развернуть">−</button>
          </div>

          <div id="self-panel-body" class="player-panel-body">
            <p id="self-edit-hint" class="hint-text">
              Ведущий пока не разрешил игрокам менять свои данные.
            </p>
            <form id="self-edit-form" class="player-form">
              <input id="self-name" type="text" placeholder="Ваше имя" required />
              <label class="btn btn-secondary">
                Аватар (файл)
                <input id="self-avatar-file" type="file" accept="image/*" hidden />
              </label>
              <input id="self-avatar-url" type="url" placeholder="или URL аватара" />
              <button id="self-edit-save-btn" type="submit" class="btn btn-primary">Сохранить</button>
            </form>
          </div>
        </aside>
      </div>
    </section>

    <div id="status" class="status" hidden></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
